# Build, lint, typecheck and test, with a real MQTT broker and two real SQL servers alongside.
#
# The servers are the point. Roughly a third of this suite talks to a broker and the relational
# package answers the same questions against Postgres and MySQL, and all of those tests skip
# themselves when nothing is reachable - which is right on a laptop and wrong here, because a run
# that reports itself green having quietly skipped them is the run somebody trusts.
# SOURCE_RPC_REQUIRE_BROKER, SOURCE_RPC_REQUIRE_SQL and SOURCE_RPC_REQUIRE_MONGO turn those skips
# into failures, so an absent server cannot pass for a passing test. Each of them needs a service
# below to be worth anything: a guard set against a server nothing starts does not make the run
# honest, it makes it red for a reason no change caused.
name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            # The same images and versions as docker-compose/docker-compose.yml, so a failure here
            # is reproducible with one command locally rather than only on a runner.
            emqx:
                image: emqx/emqx:5.9.3
                ports:
                    - 1883:1883
                env:
                    # EMQX 5.9 enables password authentication out of the box, so an anonymous
                    # CONNECT - which is every peer in this suite - is refused with "Not
                    # authorized". The whole job died at the wait step below, and a broker that
                    # accepts TCP while refusing MQTT is the confusing way for it to happen.
                    # Emptying the array is the one override that works: setting `enable = false`
                    # on the existing entry replaces it rather than merging, and EMQX then refuses
                    # to start at all with `missing_mechanism_field`.
                    EMQX_AUTHENTICATION: '[]'

            # For @source-repo/relational's conformance suite, which asks all three SQL backends the
            # same questions and compares the answers. SQLite needs no server and is always in it.
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: test
                ports:
                    - 5432:5432
                # A service container has no depends_on, so the health check is the only thing that
                # keeps the suite from starting against a server still initialising - which is
                # exactly how the first local run of this suite skipped two backends.
                options: >-
                    --health-cmd "pg_isready -U test -d test"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 20

            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: test
                    MYSQL_DATABASE: test
                    MYSQL_USER: test
                    MYSQL_PASSWORD: test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 20

            # For @source-repo/document, and the one service whose absence is invisible: there is no
            # in-memory MongoDB, so without a server every test in that package skips and the package
            # reports itself green having run nothing. SOURCE_RPC_REQUIRE_MONGO below is what turns
            # that into a failure - and it was set here before this service existed, so the job died
            # on every run until it did. `ping` is one of the few commands a mongod answers before
            # authentication, which is what lets the health check work against a server that has root
            # credentials configured.
            mongo:
                image: mongo:8.0
                env:
                    MONGO_INITDB_ROOT_USERNAME: test
                    MONGO_INITDB_ROOT_PASSWORD: test
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 20

        env:
            MSGRPC_TEST_BROKER: mqtt://localhost:1883
            MSGRPC_TEST_POSTGRES: postgres://test:test@localhost:5432/test
            MSGRPC_TEST_MYSQL: mysql://test:test@localhost:3306/test
            MSGRPC_TEST_MONGO: mongodb://test:test@localhost:27017/?authSource=admin
            # Without these the suite would pass on a runner whose servers never came up. The Mongo
            # one matters most of the three: there is no in-memory MongoDB, so every test in
            # @source-repo/document needs a server and the whole package skips without one - where
            # the relational suite would still run SQLite and notice most things.
            SOURCE_RPC_REQUIRE_BROKER: '1'
            SOURCE_RPC_REQUIRE_SQL: '1'
            SOURCE_RPC_REQUIRE_MONGO: '1'
            # @source-repo/signalr talks to a C# hub built from packages/csharp. It is not a
            # service container because it is built from this repository rather than pulled, so it
            # is started as a step below - after the checkout that contains it.
            SOURCE_RPC_TEST_SIGNALR_HUB: http://127.0.0.1:5217/rpc
            SOURCE_RPC_REQUIRE_SIGNALR: '1'
            # The same C# peer again on the other two carriers, which is the point of running them
            # here: the dispatcher, the responder, the ownership and the idempotency store are
            # shared, so a semantic that only holds over SignalR would pass its own suite and fail
            # these. Each is started as a step below, for the reason the hub is.
            SOURCE_RPC_TEST_CSHARP_MQTT: csharp-mqtt
            SOURCE_RPC_TEST_CSHARP_MQTT_SIGNED: csharp-signed
            SOURCE_RPC_TEST_CSHARP_MQTT_SECRET: interop-secret
            SOURCE_RPC_TEST_CSHARP_SOCKETIO: csharp-socketio
            SOURCE_RPC_REQUIRE_CSHARP_MQTT: '1'
            SOURCE_RPC_REQUIRE_CSHARP_SOCKETIO: '1'

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            # For the SignalR interop tests, which drive a real TypeScript client against the real
            # C# hub in packages/csharp. Without an SDK those tests skip - and
            # SOURCE_RPC_REQUIRE_SIGNALR above turns that skip into a failure, so this is not
            # optional here. 8.0 because that is what the hub targets.
            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: '8.0.x'

            # A lock file is a function of the npm that wrote it, and this one is written by npm 12.
            # npm 10 - what Node 22 bundles - resolves `@docsearch/react`'s peer range of react
            # `>= 16.8.0 < 19.0.0` against this workspace's React 19 by wanting a nested React 18
            # that an npm 12 lock does not record, and `npm ci` then refuses the whole install with
            # "Missing: react@18.3.1 from lock file" - which is where every workflow died for two
            # days. Node stays at 22 because that is what the packages claim to support; only the
            # installer is pinned, and npm 12 runs on 22.22.2 and up.
            - run: npm i -g npm@12

            - run: npm ci

            # A service container is started before the job, not necessarily *ready* before it: EMQX
            # takes a few seconds to open 1883. Waiting here rather than lengthening every test's
            # connect timeout keeps the wait in one place, and fails with a clear message if the
            # broker never arrives - rather than as a dozen puzzling test failures. The three servers
            # with a health check need no such step, because the runner already withholds the job
            # until they answer one; EMQX has none, which is why this is here and they are not.
            - name: Wait for the broker
              run: node tools/wait-for-port.mjs 1883 "MQTT broker"

            # Before lint and typecheck: the CLI reads the library's types from its build output, so
            # neither can say anything useful until the library has been built once.
            - run: npm run build

            - run: npm run lint

            - run: npm run typecheck

            # The contracts in the repository are extracted from source and committed. This is what
            # catches a service whose shape changed without `npm run contract` being run after it.
            - name: Check the committed contracts
              run: npm run check:contract --workspace=@source-repo/rpc-cli

            # Started here rather than as a service container: it is built from this repository, so
            # it cannot exist until the checkout has happened. Backgrounded and then waited for, the
            # same shape as the broker wait above and for the same reason - a hub that has not
            # finished binding its port yet would otherwise surface as a dozen puzzling failures.
            #
            # The polling watcher is not about speed. The default configuration watcher takes an
            # inotify instance, and a runner that has spent its allowance throws at startup with an
            # IOException naming inotify and nothing about this repository - which is a long way to
            # travel from the symptom. A test host reads no configuration it could usefully reload.
            # Started here rather than as a service container: it is built from this repository, so
            # it cannot exist until the checkout has happened.
            #
            # The polling watcher is not about speed. The default configuration watcher takes an
            # inotify instance, and a runner that has spent its allowance throws at startup with an
            # IOException naming inotify and nothing about this repository - which is a long way to
            # travel from the symptom. A test host reads no configuration it could usefully reload.
            # The C# unit tests, which run nowhere else. Several of the behaviours they cover cannot
            # be reached from the TypeScript suite at all: a duplicate idempotency claim is a race
            # inside one process, and the router's takeover race needs two threads interleaved at a
            # single line. A green interop suite says nothing about either.
            - name: Test the C# packages
              env:
                  DOTNET_USE_POLLING_FILE_WATCHER: '1'
              run: dotnet test packages/csharp/SourceRpc.sln -c Release

            - name: Start the C# peers
              env:
                  DOTNET_USE_POLLING_FILE_WATCHER: '1'
              run: |
                  dotnet build packages/csharp/TestHost/TestHost.csproj -c Release
                  nohup dotnet run --project packages/csharp/TestHost/TestHost.csproj \
                      -c Release --no-build -- --urls http://127.0.0.1:5217 > /tmp/signalr-hub.log 2>&1 &
                  node tools/wait-for-port.mjs 5217 "SignalR hub"

                  # A peer on the broker, and a second one that signs every frame and refuses
                  # anything unsigned. Two processes rather than one option, because a peer cannot
                  # be both: verification is on or off for the whole link, and both states need
                  # covering - the signed suite proves the checks bite, the unsigned one proves
                  # they are not what makes the protocol work.
                  RPC_PEER_NAME=csharp-mqtt nohup dotnet run --project packages/csharp/TestHost/TestHost.csproj \
                      -c Release --no-build -- mqtt "$MSGRPC_TEST_BROKER" msgrpc/v2 > /tmp/csharp-mqtt.log 2>&1 &
                  RPC_PEER_NAME=csharp-signed RPC_MQTT_SECRET="$SOURCE_RPC_TEST_CSHARP_MQTT_SECRET" \
                      nohup dotnet run --project packages/csharp/TestHost/TestHost.csproj \
                      -c Release --no-build -- mqtt "$MSGRPC_TEST_BROKER" msgrpc/v2 > /tmp/csharp-signed.log 2>&1 &

                  # And one on socket.io, which is the only peer here that cannot be waited for:
                  # it dials a server the test suite starts, so it is *expected* to be unconnected
                  # until then and its retry loop is what closes the gap.
                  RPC_PEER_NAME=csharp-socketio nohup dotnet run --project packages/csharp/TestHost/TestHost.csproj \
                      -c Release --no-build -- socketio http://127.0.0.1:3970 > /tmp/csharp-socketio.log 2>&1 &

                  for log in /tmp/csharp-mqtt.log /tmp/csharp-signed.log; do
                      for _ in $(seq 1 60); do
                          grep -q RPC-MQTT-READY "$log" && break
                          sleep 1
                      done
                      grep -q RPC-MQTT-READY "$log" || { echo "peer never reached the broker:"; cat "$log"; exit 1; }
                  done

            - run: npm test

            # The hub logs a warning when it cannot bind a frame and answers nothing, which from the
            # client side is indistinguishable from being ignored. Worth having in the run that
            # failed rather than reproducing it to find out.
            - name: The peers' logs, if anything failed
              if: failure()
              run: |
                  for log in /tmp/signalr-hub.log /tmp/csharp-mqtt.log /tmp/csharp-signed.log /tmp/csharp-socketio.log; do
                      echo "===== $log"
                      cat "$log" || true
                  done

    # The platform some of the devices are, which is the only reason this is here: there are Windows
    # Embedded PLCs that would run a peer, and "it probably works" is not something a plant should
    # find out at commissioning.
    #
    # No broker here, and no SQL servers, and it is worth writing down why rather than leaving it to
    # be rediscovered.
    #
    # Service containers are Linux-only on GitHub's runners, and the Windows runner cannot run a
    # Linux one either - its Docker is in Windows-container mode and Linux images need WSL2, which
    # is not available. Chocolatey has no mosquitto package. What is left is downloading a broker
    # binary and pinning a version that will rot, which is more machinery than the gap deserves.
    # The same applies to Postgres and MySQL, with one difference that makes it cheaper still: the
    # relational suite always runs SQLite, which needs no server at all, so what skips here is the
    # cross-backend comparison rather than the package's own behaviour.
    #
    # So the MQTT tests skip here, and SOURCE_RPC_REQUIRE_BROKER is deliberately *not* set. What
    # that leaves uncovered is MqttTransport on Windows - and the reason it is an acceptable gap
    # rather than a worrying one is that the transport is mqtt.js over a TCP socket: no paths, no
    # child processes, no shell, nothing a platform is likely to differ on. The things that did
    # differ were the two places that spawn a process, and those are covered below.
    #
    # The suite is known to pass against Mosquitto as well as EMQX, so if this is ever worth closing,
    # any broker will do - it is the installing that is awkward, not the compatibility.
    windows:
        runs-on: windows-latest

        env:
            # The SignalR interop tests do run here, and this is the job where they matter most: the
            # hub's reason for existing is a .NET process driving Visual Studio, which is a Windows
            # process. Testing the C# half only on Linux would be exercising it everywhere except
            # where it is going to live.
            SOURCE_RPC_TEST_SIGNALR_HUB: http://127.0.0.1:5217/rpc
            SOURCE_RPC_REQUIRE_SIGNALR: '1'
            # Deliberately no C# transport peers here, and no SOURCE_RPC_REQUIRE_CSHARP_* to demand
            # them: this job has no broker (see the note above the job) and starts no socket.io
            # peer, so requiring either would fail a suite for being unable to run rather than for
            # being wrong. What Windows covers is the SignalR pairing, which needs no server
            # containers - the gap is the same one the broker note already accounts for.

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            # 8.0 because the hub targets net8.0 - and specifically because a runner needs the
            # ASP.NET Core 8 *shared framework*, not merely the .NET 8 runtime. They install
            # separately, which is worth knowing before it is diagnosed: a machine can run a net8.0
            # console application perfectly and still fail a hub at launch with
            # "Framework: 'Microsoft.AspNetCore.App', version '8.0.0' not found". A console
            # self-test cannot catch it, because a console application never asks for the web
            # framework. `dotnet-install` of the SDK brings both, and so does a hosted runner's;
            # a machine with only the runtime hand-placed may not.
            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: '8.0.x'

            # The npm that wrote the lock file, not the one Node 22 bundles - see the test job above.
            - run: npm i -g npm@12

            - run: npm ci

            - run: npm run build

            - run: npm run typecheck

            # The hub and the tests share one step, deliberately, and it is the one place this job
            # differs in shape from the Linux one.
            #
            # A step's shell exiting is not documented to leave a child running, and the question is
            # not answerable from a workstation: measured over SSH on a real Windows machine, a
            # process started with Start-Process dies when the session that launched it ends -
            # with and without -NoNewWindow, so it is the session teardown rather than the switch.
            # That teardown is OpenSSH's rather than a runner's, so it does not prove the runner
            # would do the same; what it proves is that "it survives the shell" is an assumption
            # nothing available here can check. Keeping the hub inside the step that uses it removes
            # the assumption instead of betting on it - the child is alive for the whole step by
            # construction, which is all these tests need.
            - name: Run the suite against a SignalR hub
              run: |
                  dotnet build packages/csharp/TestHost/TestHost.csproj -c Release
                  Start-Process -FilePath dotnet `
                      -ArgumentList 'run','--project','packages/csharp/TestHost/TestHost.csproj','-c','Release','--no-build','--','--urls','http://127.0.0.1:5217' `
                      -RedirectStandardOutput signalr-hub.log -RedirectStandardError signalr-hub.err -NoNewWindow
                  node tools/wait-for-port.mjs 5217 "SignalR hub"
                  npm test

            - name: The hub's log, if anything failed
              if: failure()
              run: |
                  Get-Content signalr-hub.log -ErrorAction SilentlyContinue
                  Get-Content signalr-hub.err -ErrorAction SilentlyContinue

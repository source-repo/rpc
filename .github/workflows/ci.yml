# Build, lint, typecheck and test, with a real MQTT broker and two real SQL servers alongside.
#
# The servers are the point. Roughly a third of this suite talks to a broker and the relational
# package answers the same questions against Postgres and MySQL, and all of those tests skip
# themselves when nothing is reachable - which is right on a laptop and wrong here, because a run
# that reports itself green having quietly skipped them is the run somebody trusts.
# SOURCE_RPC_REQUIRE_BROKER and SOURCE_RPC_REQUIRE_SQL turn those skips into failures, so an absent
# server cannot pass for a passing test.
name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            # The same images and versions as docker-compose/docker-compose.yml, so a failure here
            # is reproducible with one command locally rather than only on a runner.
            emqx:
                image: emqx/emqx:5.9.3
                ports:
                    - 1883:1883

            # For @source-repo/relational's conformance suite, which asks all three SQL backends the
            # same questions and compares the answers. SQLite needs no server and is always in it.
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: test
                ports:
                    - 5432:5432
                # A service container has no depends_on, so the health check is the only thing that
                # keeps the suite from starting against a server still initialising - which is
                # exactly how the first local run of this suite skipped two backends.
                options: >-
                    --health-cmd "pg_isready -U test -d test"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 20

            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: test
                    MYSQL_DATABASE: test
                    MYSQL_USER: test
                    MYSQL_PASSWORD: test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 20

        env:
            MSGRPC_TEST_BROKER: mqtt://localhost:1883
            MSGRPC_TEST_POSTGRES: postgres://test:test@localhost:5432/test
            MSGRPC_TEST_MYSQL: mysql://test:test@localhost:3306/test
            MSGRPC_TEST_MONGO: mongodb://test:test@localhost:27017/?authSource=admin
            # Without these the suite would pass on a runner whose servers never came up. The Mongo
            # one matters most of the three: there is no in-memory MongoDB, so every test in
            # @source-repo/document needs a server and the whole package skips without one - where
            # the relational suite would still run SQLite and notice most things.
            SOURCE_RPC_REQUIRE_BROKER: '1'
            SOURCE_RPC_REQUIRE_SQL: '1'
            SOURCE_RPC_REQUIRE_MONGO: '1'

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            # A lock file is a function of the npm that wrote it, and this one is written by npm 12.
            # npm 10 - what Node 22 bundles - resolves `@docsearch/react`'s peer range of react
            # `>= 16.8.0 < 19.0.0` against this workspace's React 19 by wanting a nested React 18
            # that an npm 12 lock does not record, and `npm ci` then refuses the whole install with
            # "Missing: react@18.3.1 from lock file" - which is where every workflow died for two
            # days. Node stays at 22 because that is what the packages claim to support; only the
            # installer is pinned, and npm 12 runs on 22.22.2 and up.
            - run: npm i -g npm@12

            - run: npm ci

            # A service container is started before the job, not necessarily *ready* before it: EMQX
            # takes a few seconds to open 1883. Waiting here rather than lengthening every test's
            # connect timeout keeps the wait in one place, and fails with a clear message if the
            # broker never arrives - rather than as a dozen puzzling test failures.
            - name: Wait for the broker
              run: |
                  node -e '
                    const net = require("net")
                    const deadline = Date.now() + 60000
                    const attempt = () => {
                      const socket = net.connect(1883, "127.0.0.1")
                      socket.once("connect", () => { socket.end(); console.log("broker is up"); process.exit(0) })
                      socket.once("error", () => {
                        socket.destroy()
                        if (Date.now() > deadline) { console.error("no MQTT broker on 1883 after 60s"); process.exit(1) }
                        setTimeout(attempt, 500)
                      })
                    }
                    attempt()
                  '

            # Before lint and typecheck: the CLI reads the library's types from its build output, so
            # neither can say anything useful until the library has been built once.
            - run: npm run build

            - run: npm run lint

            - run: npm run typecheck

            # The contracts in the repository are extracted from source and committed. This is what
            # catches a service whose shape changed without `npm run contract` being run after it.
            - name: Check the committed contracts
              run: npm run check:contract --workspace=@source-repo/rpc-cli

            - run: npm test

    # The platform some of the devices are, which is the only reason this is here: there are Windows
    # Embedded PLCs that would run a peer, and "it probably works" is not something a plant should
    # find out at commissioning.
    #
    # No broker here, and no SQL servers, and it is worth writing down why rather than leaving it to
    # be rediscovered.
    #
    # Service containers are Linux-only on GitHub's runners, and the Windows runner cannot run a
    # Linux one either - its Docker is in Windows-container mode and Linux images need WSL2, which
    # is not available. Chocolatey has no mosquitto package. What is left is downloading a broker
    # binary and pinning a version that will rot, which is more machinery than the gap deserves.
    # The same applies to Postgres and MySQL, with one difference that makes it cheaper still: the
    # relational suite always runs SQLite, which needs no server at all, so what skips here is the
    # cross-backend comparison rather than the package's own behaviour.
    #
    # So the MQTT tests skip here, and SOURCE_RPC_REQUIRE_BROKER is deliberately *not* set. What
    # that leaves uncovered is MqttTransport on Windows - and the reason it is an acceptable gap
    # rather than a worrying one is that the transport is mqtt.js over a TCP socket: no paths, no
    # child processes, no shell, nothing a platform is likely to differ on. The things that did
    # differ were the two places that spawn a process, and those are covered below.
    #
    # The suite is known to pass against Mosquitto as well as EMQX, so if this is ever worth closing,
    # any broker will do - it is the installing that is awkward, not the compatibility.
    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            # The npm that wrote the lock file, not the one Node 22 bundles - see the test job above.
            - run: npm i -g npm@12

            - run: npm ci

            - run: npm run build

            - run: npm run typecheck

            - run: npm test

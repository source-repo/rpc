# Publish the npm packages, the four NuGet packages and the CLI image, on a version tag.
#
# Two forms, because two things can be released:
#
#   git tag v3.0.0 && git push origin v3.0.0                  # the repository
#   git tag aspects-v0.3.0 && git push origin aspects-v0.3.0  # one package, alone
#
# The first publishes everything versioned with the library, the NuGet packages and the image, and
# the tag must match the library and the CLI exactly. The second publishes only that package - no
# NuGet, no image, nothing else on npm - and is refused for a package inside the lockstep, whose
# number is a statement about which library it agrees with.
#
# From CI rather than a laptop, for the ordinary reason: what gets published is then exactly what is
# on the tag, built by a machine with no half-finished work in its tree, and the credentials live in
# one place instead of in everyone's ~/.npmrc.
name: Release

on:
    push:
        # `v5.3.1` releases the repository. `aspects-v0.3.0` releases one package that versions
        # on its own - and the list is spelled out rather than globbed, because being outside the
        # lockstep is a decision recorded in CLAUDE.md, not something a tag should be able to claim.
        tags: ['v*', 'queue-v*', 'aspects-v*', 'documentation-v*']
    # So a failed publish can be retried without moving the tag.
    workflow_dispatch:
        inputs:
            ref:
                description: The tag to publish
                required: true

jobs:
    # The same gate as CI, because a tag is not a reason to skip it - and a broker container, since
    # a third of this suite needs one and skipping those tests here would defeat the point.
    verify:
        runs-on: ubuntu-latest
        outputs:
            whole: ${{ steps.plan.outputs.whole }}
            package: ${{ steps.plan.outputs.package }}
        services:
            emqx:
                image: emqx/emqx:5.9.3
                ports:
                    - 1883:1883
        env:
            MSGRPC_TEST_BROKER: mqtt://localhost:1883
            SOURCE_RPC_REQUIRE_BROKER: '1'
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.inputs.ref || github.ref }}
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            # The npm that wrote the lock file, not the one Node 22 bundles - see ci.yml.
            - run: npm i -g npm@12

            - run: npm ci
            - name: Wait for the broker
              run: |
                  node -e '
                    const net = require("net")
                    const deadline = Date.now() + 60000
                    const attempt = () => {
                      const socket = net.connect(1883, "127.0.0.1")
                      socket.once("connect", () => { socket.end(); process.exit(0) })
                      socket.once("error", () => {
                        socket.destroy()
                        if (Date.now() > deadline) { console.error("no MQTT broker on 1883 after 60s"); process.exit(1) }
                        setTimeout(attempt, 500)
                      })
                    }
                    attempt()
                  '
            - run: npm run build
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run check:contract --workspace=@source-repo/rpc-cli
            - run: npm test

            # The tag and the package version have to agree, or the image built below installs a
            # version other than the one this tag was cut from.
            # What this tag releases, and whether the tree agrees with it.
            #
            # Two forms. `v5.3.1` is the repository: the library, the CLI, everything versioned with
            # them, the NuGet packages and the image, and the tag has to match the library and the
            # CLI exactly. `aspects-v0.3.0` is one package that versions on its own, and publishes
            # only itself - no NuGet, no image, and nothing else on npm.
            #
            # The second form exists because the first taxed it. 5.3.1 moved eleven npm packages and
            # four NuGet ones to publish a change in one of them, since a tag is what publishes and a
            # tag was spelled with the library's version. That is honest and it does not scale with a
            # package that iterates.
            - name: What this tag releases
              id: plan
              run: |
                  tag="${{ github.event.inputs.ref || github.ref_name }}"
                  if [ "${tag#v}" != "$tag" ]; then
                    version="${tag#v}"
                    library="$(node -p "require('./packages/rpc/package.json').version")"
                    cli="$(node -p "require('./packages/cli/package.json').version")"
                    if [ "$version" != "$library" ] || [ "$version" != "$cli" ]; then
                      echo "tag $tag, library v$library, cli v$cli - they must all agree"
                      exit 1
                    fi
                    echo "whole=true" >> "$GITHUB_OUTPUT"
                    echo "package=" >> "$GITHUB_OUTPUT"
                    echo "releasing the repository at $version"
                  else
                    package="${tag%-v*}"
                    version="${tag##*-v}"
                    directory="packages/${package}"
                    if [ ! -f "${directory}/package.json" ]; then
                      echo "tag $tag names ${directory}, which is not a package here"
                      exit 1
                    fi
                    # Refused rather than published: a package inside the lockstep has a number that
                    # says which library it agrees with, and publishing one alone would make that
                    # number a claim nobody checked.
                    case "$package" in
                      queue|aspects|documentation) ;;
                      *) echo "$package versions with the library - release it with a v$version tag, or take it out of the lockstep in CLAUDE.md first"; exit 1 ;;
                    esac
                    declared="$(node -p "require('./${directory}/package.json').version")"
                    if [ "$version" != "$declared" ]; then
                      echo "tag $tag, but ${directory} says $declared"
                      exit 1
                    fi
                    echo "whole=false" >> "$GITHUB_OUTPUT"
                    echo "package=${package}" >> "$GITHUB_OUTPUT"
                    echo "releasing ${package} alone at $version"
                  fi

    npm:
        needs: verify
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # For --provenance below, which signs a statement of where and from what commit these
            # tarballs were built using this run's OIDC identity. Needs a public repository.
            id-token: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.inputs.ref || github.ref }}
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://registry.npmjs.org
            # The npm that wrote the lock file, not the one Node 22 bundles - see ci.yml.
            - run: npm i -g npm@12

            - run: npm ci
            - run: npm run build

            # The library first: the CLI depends on it by version, so publishing the CLI against a
            # library that is not there yet gives anyone installing it in that window a broken tree.
            #
            # Skipped rather than failed when the version is already on the registry. A version that
            # is published is published - npm will not take it back - so the useful behaviour is to
            # carry on to the image rather than stop the release because someone published by hand.
            - name: Publish the library
              if: needs.verify.outputs.whole == 'true'
              working-directory: packages/rpc
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  version=$(node -p "require('./package.json').version")
                  # Asked of the registry directly rather than through `npm view`, which reads the
                  # .npmrc setup-node wrote and fails confusingly when NPM_TOKEN is unset - turning
                  # "already published, nothing to do" into "try to publish without credentials".
                  if curl -fsSL -o /dev/null "https://registry.npmjs.org/@source-repo%2frpc/${version}"; then
                    echo "@source-repo/rpc@${version} is already published"
                  else
                    npm publish --access public --provenance
                  fi
            - name: Publish the CLI
              if: needs.verify.outputs.whole == 'true'
              working-directory: packages/cli
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  version=$(node -p "require('./package.json').version")
                  if curl -fsSL -o /dev/null "https://registry.npmjs.org/@source-repo%2frpc-cli/${version}"; then
                    echo "@source-repo/rpc-cli@${version} is already published"
                  else
                    npm publish --access public --provenance
                  fi

            # Versions with the library rather than on its own, so it rides the same tag and the
            # already-published guard makes that free: a tag cut without touching it publishes
            # nothing here.
            - name: Publish docker
              if: needs.verify.outputs.whole == 'true'
              working-directory: packages/docker
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  version=$(node -p "require('./package.json').version")
                  if curl -fsSL -o /dev/null "https://registry.npmjs.org/@source-repo%2fdocker/${version}"; then
                    echo "@source-repo/docker@${version} is already published"
                  else
                    npm publish --access public --provenance
                  fi

            # The queue versions on its own - deliberately outside the versions-together rule - so
            # it rides every release tag and the already-published guard is what makes that free:
            # a tag cut without touching the queue publishes nothing here.
            - name: Publish the queue
              if: needs.verify.outputs.whole == 'true' || needs.verify.outputs.package == 'queue'
              working-directory: packages/queue
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  version=$(node -p "require('./package.json').version")
                  if curl -fsSL -o /dev/null "https://registry.npmjs.org/@source-repo%2fqueue/${version}"; then
                    echo "@source-repo/queue@${version} is already published"
                  else
                    npm publish --access public --provenance
                  fi

            # The pull half, on its own version line for the queue's reason: it is built against the
            # library's public API rather than against its shape, so pinning it to the library's
            # number would state an agreement it is not keeping. Same guard, same free ride.
            # What a component keeps across activations. Its own line for the same reason, and it
            # will move faster than the library while the online-change phases land.
            - name: Publish the continuity package
              if: needs.verify.outputs.whole == 'true'
              working-directory: packages/continuity
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  version=$(node -p "require('./package.json').version")
                  if curl -fsSL -o /dev/null "https://registry.npmjs.org/@source-repo%2fcontinuity/${version}"; then
                    echo "@source-repo/continuity@${version} is already published"
                  else
                    npm publish --access public --provenance
                  fi

            # Live values beside the source that declares them. Its own line, like the rest of the
            # 0.x packages, and the same guard makes riding every tag free.
            - name: Publish the diagnostics package
              if: needs.verify.outputs.whole == 'true'
              working-directory: packages/diagnostics
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  version=$(node -p "require('./package.json').version")
                  if curl -fsSL -o /dev/null "https://registry.npmjs.org/@source-repo%2fdiagnostics/${version}"; then
                    echo "@source-repo/diagnostics@${version} is already published"
                  else
                    npm publish --access public --provenance
                  fi

            - name: Publish the query package
              if: needs.verify.outputs.whole == 'true'
              working-directory: packages/query
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  version=$(node -p "require('./package.json').version")
                  if curl -fsSL -o /dev/null "https://registry.npmjs.org/@source-repo%2fquery/${version}"; then
                    echo "@source-repo/query@${version} is already published"
                  else
                    npm publish --access public --provenance
                  fi

            # Several structures over the same objects, and the documentation provider that was the
            # first thing to need them. Both version on their own, like the queue and for the queue's
            # reason: they depend on the library's public API rather than on its shape, so pinning
            # them to its number would state an agreement they are not keeping.
            #
            # Ordered so `aspects` goes first. `documentation` depends on it by version, and
            # publishing the dependent against a dependency that is not there yet gives anyone
            # installing it in that window a broken tree - the same reason the library precedes the
            # CLI at the top of this job.
            - name: Publish the aspects package
              if: needs.verify.outputs.whole == 'true' || needs.verify.outputs.package == 'aspects'
              working-directory: packages/aspects
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  version=$(node -p "require('./package.json').version")
                  if curl -fsSL -o /dev/null "https://registry.npmjs.org/@source-repo%2faspects/${version}"; then
                    echo "@source-repo/aspects@${version} is already published"
                  else
                    npm publish --access public --provenance
                  fi

            - name: Publish the documentation package
              if: needs.verify.outputs.whole == 'true' || needs.verify.outputs.package == 'documentation'
              working-directory: packages/documentation
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  version=$(node -p "require('./package.json').version")
                  if curl -fsSL -o /dev/null "https://registry.npmjs.org/@source-repo%2fdocumentation/${version}"; then
                    echo "@source-repo/documentation@${version} is already published"
                  else
                    npm publish --access public --provenance
                  fi

            # The TypeScript half of reaching a .NET peer. It versions with the library rather than
            # on its own, because it carries the flat frame to a C# hub and a client pinned to one
            # shape of that frame is easier to reason about than one that says nothing about which
            # library it agrees with - the same rule the CLI follows.
            #
            # Left out of this job until now, which is exactly the drift the rule exists to prevent:
            # every other package moved to 5.1.0 on a tag and this one stayed at 5.0.0, published by
            # hand and then not.
            - name: Publish the SignalR client
              if: needs.verify.outputs.whole == 'true'
              working-directory: packages/signalr
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  version=$(node -p "require('./package.json').version")
                  if curl -fsSL -o /dev/null "https://registry.npmjs.org/@source-repo%2fsignalr/${version}"; then
                    echo "@source-repo/signalr@${version} is already published"
                  else
                    npm publish --access public --provenance
                  fi

    # Independent of npm: these are different packages on a different registry, and one being
    # down or rate-limited is not a reason the other cannot ship.
    #
    # The .NET version is deliberately *not* required to match the tag. It lives in
    # packages/csharp/Directory.Build.props and moves when the C# packages actually change - a
    # documentation fix to the TypeScript README is not a reason to publish four NuGet packages
    # with nothing in them. The already-published guard is what makes riding every tag free, the
    # same bargain the queue and docker packages make above.
    nuget:
        needs: verify
        # The .NET packages carry the library's number, so they move when it does and never
        # because one npm package that versions on its own was released.
        if: needs.verify.outputs.whole == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.inputs.ref || github.ref }}
            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: '8.0.x'

            # The unit tests, which are the only place several of these behaviours can be checked:
            # a duplicate idempotency claim is a race inside one process, and the router's takeover
            # race needs two threads interleaved at one line. Nothing driven over a wire reaches
            # either, so a green interop suite says nothing about them.
            - name: Test
              env:
                  DOTNET_USE_POLLING_FILE_WATCHER: '1'
              run: dotnet test packages/csharp/SourceRpc.sln -c Release

            - name: Pack
              run: dotnet pack packages/csharp/SourceRpc.sln -c Release -o nupkg

            # Installed into a fresh project from an empty cache, and compiled against. Packing
            # proves a file was produced; it does not prove anyone can use it. A missing dependency,
            # an unconsumable target framework or a type left internal all pack perfectly and fail
            # at whoever installs them first - and on NuGet a version, once pushed, cannot be
            # replaced. This is the last point at which that is still fixable.
            - name: Smoke-test the packages
              run: packages/csharp/smoke-test.sh nupkg

            # Skipped rather than failed when the version is already there, for the reason the npm
            # steps are: a published version is published, and stopping the release over one that
            # somebody pushed by hand helps nobody.
            - name: Publish to NuGet
              env:
                  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
              run: |
                  if [ -z "${NUGET_API_KEY}" ]; then
                    echo "NUGET_API_KEY is not set - nothing can be published"
                    exit 1
                  fi
                  version=$(grep -oP '(?<=<SourceRpcVersion>)[^<]+' packages/csharp/Directory.Build.props)
                  # SourceRpc.Query and SourceRpc.Continuity are on version lines of their own and
                  # cannot ride the shared number, so the loop carries a version per package rather
                  # than one for all of them.
                  query=$(grep -oP '(?<=<PackageVersionOverride>)[^<]+' packages/csharp/SourceRpc.Query/SourceRpc.Query.csproj)
                  continuity=$(grep -oP '(?<=<PackageVersionOverride>)[^<]+' packages/csharp/SourceRpc.Continuity/SourceRpc.Continuity.csproj)
                  echo "SourceRpc ${version}, SourceRpc.Query ${query}, SourceRpc.Continuity ${continuity}"
                  for entry in "SourceRpc=${version}" "SourceRpc.SignalR=${version}" "SourceRpc.Mqtt=${version}" "SourceRpc.SocketIo=${version}" "SourceRpc.Query=${query}" "SourceRpc.Continuity=${continuity}"; do
                    package="${entry%%=*}"
                    # A name of its own rather than reusing `version`: the list above was expanded
                    # before the loop ran, so overwriting it would work and would read as though the
                    # shared number were being clobbered halfway through.
                    packageVersion="${entry##*=}"
                    # Asked of the registry directly. `dotnet nuget push --skip-duplicate` would
                    # also survive a repeat, but it cannot tell "already published" from a push
                    # that silently did nothing, and this loop should be able to say which.
                    if curl -fsSL -o /dev/null "https://api.nuget.org/v3-flatcontainer/${package,,}/${packageVersion}/${package,,}.nuspec" 2>/dev/null; then
                      echo "  ${package} ${packageVersion} is already published"
                    else
                      # The symbols ride along: dotnet nuget push sends the matching .snupkg with
                      # the package unless told not to, which is what makes a stack trace from a
                      # plant resolve to a line of this repository.
                      dotnet nuget push "nupkg/${package}.${packageVersion}.nupkg" \
                        --source https://api.nuget.org/v3/index.json \
                        --api-key "${NUGET_API_KEY}"
                      echo "  published ${package} ${packageVersion}"
                    fi
                  done

    # After npm, because the image installs the published CLI rather than building the repository.
    container:
        needs: [verify, npm]
        # The image is the CLI, which is in the lockstep. A package released alone changes
        # nothing in it, and rebuilding it would republish `latest` for no reason.
        if: needs.verify.outputs.whole == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.inputs.ref || github.ref }}

            - name: Log in to GitHub Packages
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  # Provided by Actions; no secret to create or rotate.
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Tags for this version
              id: tags
              env:
                  REF: ${{ github.event.inputs.ref || github.ref_name }}
              run: |
                  version="${REF#v}"
                  image=ghcr.io/${{ github.repository_owner }}/rpc-cli
                  # Exact, minor and major, so a compose file can pin as tightly as it wants to.
                  echo "tags=${image}:${version},${image}:${version%.*},${image}:${version%%.*},${image}:latest" >> "$GITHUB_OUTPUT"
                  # The development image is the same version with a suffix, and takes `dev` rather
                  # than `latest`: whoever pulls the bare name should get the one meant for a plant.
                  echo "devtags=${image}:${version}-dev,${image}:${version%.*}-dev,${image}:${version%%.*}-dev,${image}:dev" >> "$GITHUB_OUTPUT"
                  echo "version=${version}" >> "$GITHUB_OUTPUT"

            # A package published a minute ago is not necessarily installable yet. npm's write
            # path returns before its read path has the packument, and `npm install` resolves
            # through the packument - so `https://registry.npmjs.org/<pkg>/<version>` can answer 200
            # with a real manifest while `npm install` still gets a 404 for the same version.
            #
            # 5.2.0 hit exactly that. `continuity` and `diagnostics` were published for the first
            # time by the npm job above, and this image's install failed on `diagnostics` while its
            # tarball was already on the registry and its provenance already in the transparency
            # log. A first publish is when the gap is widest, which is also when a release is most
            # likely to add a package the CLI depends on.
            #
            # Waiting rather than retrying the build: the image is multi-arch and the arm64 half is
            # emulated, so rebuilding it to discover the registry is still catching up costs minutes
            # an attempt. This asks the same question the install will ask, and asks it cheaply.
            - name: Wait until the registry serves what the image installs
              env:
                  VERSION: ${{ steps.tags.outputs.version }}
              run: |
                  # Read from the CLI's own manifest, so this cannot drift from what it depends on -
                  # and take each dependency's declared range rather than assuming the release
                  # version, since a package outside the lockstep (the queue's rule) would not have
                  # it.
                  # Semicolons deliberately, unlike the rest of this repository: the last line
                  # opens with `[`, and without them it parses as an index on the line above.
                  specs=$(node -p "
                    const cli = require('./packages/cli/package.json');
                    const ours = Object.entries(cli.dependencies || {}).filter(([name]) => name.startsWith('@source-repo/'));
                    ['@source-repo/rpc-cli@' + process.env.VERSION, ...ours.map(([name, range]) => name + '@' + range)].join(' ');
                  ")
                  for spec in $specs; do
                    for attempt in $(seq 1 40); do
                      # `npm view` resolves the packument, which is the path `npm install` takes.
                      # Asking the version endpoint instead would answer before the install can.
                      if npm view "$spec" version > /dev/null 2>&1; then
                        echo "$spec resolves"
                        break
                      fi
                      if [ "$attempt" = 40 ]; then
                        echo "$spec never became installable - the npm job published it, so this is"
                        echo "the registry rather than the release. Re-run this job."
                        exit 1
                      fi
                      sleep 15
                    done
                  done

            # arm64 is built on an amd64 runner, so the emulators have to be registered first.
            # buildx alone accepts the platform and then fails inside the build with an exec format
            # error, which reads like a broken Dockerfile rather than a missing setup step.
            - uses: docker/setup-qemu-action@v4
            - uses: docker/setup-buildx-action@v4

            # Built once for amd64 and kept locally, so the scan below happens *before* anything is
            # published. buildx caches the layers, so the multi-arch build that follows only pays
            # for arm64.
            - name: Build for scanning
              uses: docker/build-push-action@v7
              with:
                  context: packages/cli
                  file: packages/cli/Dockerfile
                  platforms: linux/amd64
                  build-args: VERSION=${{ steps.tags.outputs.version }}
                  tags: rpc-cli:scan
                  load: true

            # Trivy rather than Scout: no registry credentials to hold, and it reads the built image
            # rather than a published one.
            #
            # `ignore-unfixed` is the setting that makes this worth having rather than worth muting.
            # An image inherits vulnerabilities from the Node runtime and from Alpine that have no
            # patch yet - failing on those would mean every release is red for reasons nobody in this
            # repository can act on, and a check that is always red is one nobody reads. Failing only
            # on what has a fix available means a red build is always a rebuild away from green:
            # `apk upgrade` in the Dockerfile picks up the Alpine ones, and a base-image bump picks
            # up the rest.
            - name: Scan the image
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: rpc-cli:scan
                  format: table
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true
                  exit-code: '1'

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: packages/cli
                  file: packages/cli/Dockerfile
                  # arm64 as well as amd64: a plant's edge box is as likely to be an ARM SBC as a
                  # rack server, and an image that only runs on one of them is half an image.
                  platforms: linux/amd64,linux/arm64
                  build-args: VERSION=${{ steps.tags.outputs.version }}
                  tags: ${{ steps.tags.outputs.tags }}
                  push: true

            # The development image: the same CLI with npm and python3, which `--scripts` and the
            # Python half of `--allow-exec` need in order to work at all.
            - name: Build and push the development image
              uses: docker/build-push-action@v7
              with:
                  context: packages/cli
                  file: packages/cli/Dockerfile
                  target: dev
                  platforms: linux/amd64,linux/arm64
                  build-args: VERSION=${{ steps.tags.outputs.version }}
                  tags: ${{ steps.tags.outputs.devtags }}
                  push: true

            # Reported, not enforced. This image ships npm on purpose, and npm brings its own bundled
            # dependencies and their advisories with it - that is the trade the target exists to make.
            # Failing the release on them would mean never releasing, so the finding is printed where
            # somebody deciding whether to run it can read it.
            - name: Scan the development image
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: ghcr.io/${{ github.repository_owner }}/rpc-cli:${{ steps.tags.outputs.version }}-dev
                  format: table
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true
                  exit-code: '0'

# The servers the test suite talks to. Start them all with:
#   docker compose -f docker-compose/docker-compose.yml up -d
#
# Nothing here holds anything worth keeping: every suite creates what it needs under a name unique
# to its run and drops it again, so these may be deleted and recreated at any time.
#
#   1883  MQTT           18083  dashboard (admin/public)
#   8083  MQTT over WS    8883  MQTT over TLS
#   5432  PostgreSQL      3306  MySQL       27017  MongoDB
#
# Not here, because it is built from this repository rather than pulled: the C# SignalR hub that
# @source-repo/signalr's interop tests need. Start it with
#   npm run hub --workspace=@source-repo/signalr
# and point the suite at it with SOURCE_RPC_TEST_SIGNALR_HUB - see that package's README.
services:
  emqx:
    image: emqx/emqx:5.9.3
    container_name: msgrpc-emqx
    restart: unless-stopped
    environment:
      # EMQX 5.9 enables password authentication out of the box, so an anonymous CONNECT - which is
      # every peer in this suite - is refused with "Not authorized", and a broker that accepts TCP
      # while refusing MQTT is a confusing thing to debug. Emptying the array is the one override
      # that works: setting `enable = false` on the existing entry replaces it rather than merging,
      # and EMQX then refuses to start with `missing_mechanism_field`. Kept identical to
      # .github/workflows/ci.yml, so a CI failure is still reproducible with one command here.
      EMQX_AUTHENTICATION: '[]'
    ports:
      - '1883:1883'
      - '8083:8083'
      - '8883:8883'
      - '18083:18083'
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # For @source-repo/relational. The two flavours that need a server - SQLite needs none, which is
  # why it is the one the suite can always run and these two are the ones that can be skipped.
  #
  # Credentials are `test`/`test` and deliberately trivial: this binds to localhost, holds nothing,
  # and a password worth protecting here would only ever be one somebody was tempted to reuse.
  postgres:
    image: postgres:17-alpine
    container_name: msgrpc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - '5432:5432'
    # Tmpfs rather than a volume: nothing here survives a restart on purpose, and a suite that
    # started finding yesterday's tables would be a suite that passes for the wrong reason.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d test']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M

  # For @source-repo/document. Single-node and no replica set, which is worth knowing rather than
  # discovering: without one there are no transactions and no change streams, and neither is
  # something a read-only document node asks for.
  # Pinned exactly, and downwards, which is the unusual part and the reason for the paragraph.
  # `mongo:8.0` floats, and now resolves to 8.0.28 - which refuses to start on Linux 6.19 and newer
  # with *MongoDB cannot start: ... known incompatibility* (SERVER-121912). On a kernel that new the
  # container restart-loops, `packages/document` finds no server, and every test in it skips - which
  # in a summary reads exactly like a package that passed. That is the failure this pin exists to
  # prevent, and it is why `SOURCE_RPC_REQUIRE_MONGO` is set in CI.
  #
  # 8.0.17 predates the guard. It is therefore a deliberate choice to run the combination MongoDB
  # now declines: acceptable here because this is a throwaway fixture on tmpfs holding nothing
  # anybody would miss, and not acceptable anywhere data is kept. Moving it forward again is safe
  # once a release carries a fix rather than a refusal.
  mongo:
    image: mongo:8.0.17
    container_name: msgrpc-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: test
      MONGO_INITDB_ROOT_PASSWORD: test
    ports:
      - '27017:27017'
    tmpfs:
      - /data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 768M

  mysql:
    image: mysql:8.4
    container_name: msgrpc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    ports:
      - '3306:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ptest']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 768M
